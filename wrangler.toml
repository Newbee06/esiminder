name = "esiminder"
main = "src/index.js"
compatibility_date = "2024-01-01"

# ---------------------------------------------------------------------------
# Cloudflare resources (KV + D1) — AUTO-PROVISIONED, no hardcoded IDs.
#
# Per https://developers.cloudflare.com/workers/wrangler/configuration/
# ("Automatic provisioning"): bindings declared WITHOUT resource IDs are
# automatically provisioned on deploy. Each deployment gets its OWN fresh
# KV namespace and D1 database in the deployer's Cloudflare account —
# nothing here points at the original author's resources.
#
# "Deploy to Cloudflare" button: Cloudflare provisions new D1 + KV for you.
# Manual deploy: `wrangler deploy` provisions them on first deploy too.
# Database tables are created automatically on first request (see src/db.js).
# ---------------------------------------------------------------------------

# KV: sessions, channel secrets, notification dedup state.
[[kv_namespaces]]
binding = "CFG"

# D1: business data (esims, renewal_records, notifications, settings,
#     notification_dedup, renew_idempotency).
[[d1_databases]]
binding = "DB"
database_name = "esiminder-db"

# Daily check at 09:00 Beijing time (01:00 UTC). Preserved on every deploy.
[triggers]
crons = ["0 1 * * *"]
